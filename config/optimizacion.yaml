# Optimización del sensor remolcado TIPO 2 (sensor_tipo2). Única fuente de parámetros.
# Unidades de E/S: longitud en mm, masa en g, densidad en kg/m^3, ángulos en grados.
#
# Topología (modelos/analisis_tipo2.ork): nariz + cuerpo (cilíndrico o abombado) + transición +
# TUBO DE COLA con cuatro aletas freeform sobre el tubo. Spec v2 (SPEC_sensor_tipo2_v2.md): aletas
# dentro de 1.2 R ("granada de mortero"). Los parámetros que no son de geometría (pared,
# electrónica, herraje, lastre, remolque, vuelo y criterios) funcionan como en dbf-sensor.
# PENDIENTE = supuesto de la spec v2 que el equipo debe confirmar.

materiales:                     # densidad en kg/m^3 (los de dbf-sensor)
  MAT_PARED_EQ: 1200            # dbf-sensor lo bajó a 1200 (el .ork tipo 2 aún dice 1342)
  PLA: 1240
  fibra_vidrio_epoxy: 1850
  onyx: 1200                    # ficha técnica Markforged — VERIFICAR con el perfil de impresión
  plomo: 11340

costos_usd_kg: {plomo: 4}       # aproximado, solo material

masa:
  m_max_g: 11500                # PENDIENTE: tope de masa TOTAL del sensor (spec v2 §3.6): un candidato con menos
                                # masa es factible y compite por f1. El presupuesto con MTOW 16 kg da 6200 g
  factor_llenado: 1.0           # el lastre es plomo macizo

pared:                          # capas de AFUERA hacia ADENTRO (las de dbf-sensor: ρ_eq = 1342 kg/m³)
  por_defecto:                  # el .ork tipo 2 usa una capa equivalente de 2.0 mm
    - {material: fibra_vidrio_epoxy, espesor_mm: 0.3, fraccion_solida: 1.0}
    - {material: PLA,                espesor_mm: 1.5, fraccion_solida: 1.0}
  nariz: null                   # null = por_defecto; o una lista propia
  cuerpo: null
  cola: null                    # transición
  tubo_cola: null

electronica:                    # detrás del tapón de lastre delantero, como en dbf-sensor
  longitud_mm: 20.0             # electrónica nueva (antes 100 mm)
  masa_g: 150                   # VERIFICAR: se mantuvo la masa de la electrónica anterior
  holgura_mm: 2.0
  x_cg_relativo_mm: null        # CG propio medido desde su inicio; null = centro
  r_min_mm: null                # PENDIENTE: radio interior mínimo que necesita la electrónica. null = como
                                # antes (detrás del tapón delantero y antes de la transición, sin mirar el
                                # radio); con valor puede ir en nariz, cuerpo o transición si r_i ≥ r_min

masas_puntuales:
  - {nombre: herraje_remolque, masa_g: 15, x_mm: cg}  # en el CG (el amarre va en el CG); x_mm numérico = fijo

lastre:
  r_min_util_mm: 3.0            # el tapón delantero empieza donde r_i ≥ r_min_util (x_b0)
  fraccion_max_L: 0.6           # el tapón delantero termina antes de 0.6 L (null = sin límite)
  margen_cola_mm: 5.0           # el tapón delantero y la electrónica terminan 5 mm antes de la transición
  lastre_trasero: true          # tapón trasero detrás de la electrónica (transición y tubo de cola)
  margen_popa_mm: 0.0

estabilidad:
  umbral_margen_bajo_cal: 0.3   # bandera informativa margen_SM_bajo

condiciones_vuelo:
  V_m_s: 30.0
  altitud_m: 1495               # Medellín, ISA
  mach: auto                    # auto = V / a(h)

remolque:                       # amarre en el CG (trim estático 0), como en dbf-sensor
  alpha_trim_max_deg: 5.0
  alpha_lineal_max_deg: 15.0
  tol_amarre_min_mm: 1.2        # error admisible mínimo del amarre respecto al CG (null = sin mínimo).
                                # PENDIENTE: la spec v2 supone 1.5 mm; se mantiene el 1.2 que pidió el equipo
                                # (v1). Es la restricción activa: con 1.5 la masa máxima baja (ver README)

envolvente:
  rotacion_guardado_deg: 45     # guardado acostado con las aletas en diagonal

geometria_fija:
  nariz: {forma: elipsoide, parametro: null}
  cola_recortada: true          # transición 'clipped' de OpenRocket (solo elipsoide, potencia, haack)
  aletas:
    n: 4
    rotacion_deg: 45
    material: onyx
    espesor_mm: 3.0             # el del .ork tipo 2 (FIJO: nada en el objetivo lo premia)
    fraccion_solida: 1.0
    E_GPa: 2.4                  # módulo a tracción del Onyx (flutter)
    nu: 0.38                    # supuesto
    factor_flutter: 3.0         # bandera flutter_margen_bajo si V_flutter < 3 V

malla:
  # Spec v2 rev. 2 §3.1: resolución según el criterio al que sirve cada variable
  # (A masa y B diámetro aparente finas, C estabilidad media, D ajuste fino mínima).
  # cuerpo: L_disp = L − L_n − L_tc; cuerpo cilíndrico L_c = f_cil L_disp, transición L_t = (1 − f_cil) L_disp.
  L_total_mm: [400]             # fijo: más largo siempre da más masa y más brazo (lista configurable)
  # A · masa
  D_mm: [60, 65, 70, 75, 80, 85, 90, 95, 100]  # PENDIENTE: D máximo que admite la bahía (el equipo pidió 100)
  L_tc_mm: [40, 60, 80, 100, 120, 140, 160, 180, 200]   # compromiso central: brazo contra plomo
  f_cil: [0.0, 0.25, 0.5, 0.75]             # 0 = cuerpo abombado (nariz y transición unidas)
  L_n_rel_D: [1.0, 1.25]                    # ≥ restricciones.L_n_rel_D_min
  # B · diámetro aparente
  r_tip_rel_R: [1.0, 1.05, 1.1, 1.15, 1.2]  # ≤ restricciones.r_tip_rel_R_max (restricción dura)
  # C · estabilidad
  k: [0.15, 0.2, 0.25, 0.3, 0.4]            # d_tc = k D (o bien d_tc_mm: [...] absoluto, no ambos)
  # D · ajuste fino (aletas sobre el tubo de cola, alineadas con su extremo, offset bottom = 0)
  mu_cr: [0.7, 1.0]             # c_r = μ L_tc (y c_r ≥ restricciones.c_r_min_mm)
  gamma_ct: [0.6]               # c_t = γ c_r
  sigma_flecha: [0.5, 1.0]      # x_s = σ (c_r − c_t): 1 = borde de salida recto (el .ork)
  cola_forma:
    - {forma: elipsoide, parametro: null}   # la del .ork (recortada)
    - {forma: conica,    parametro: null}

restricciones:
  L_max_mm: 400                 # largo total máximo del sensor
  SM_min_cal: 1.0
  SM_max_cal: 2.0
  L_n_rel_D_min: 1.0            # PENDIENTE: qué tan achatada puede ser la nariz
  r_tip_rel_R_max: 1.2          # RESTRICCIÓN DURA: aletas dentro de 1.2 R. Nunca se relaja para que haya ganador
  c_r_min_mm: 50                # PENDIENTE: cuerda de raíz mínima ("cuerda considerable")
  k_min: 0.15
  d_tc_min_mm: 15               # PENDIENTE: mínimo fabricable con pared de 1.8 mm y 4 aletas de 3 mm
  esbeltez_tubo_aviso: 8        # L_tc/d_tc > 8 → bandera tubo_esbelto (informativa)
  angulo_estela_aviso_deg: 12   # θ_eq > 12° → bandera aletas_en_estela (informativa)
  D_ap_max_mm: null             # tope opcional del diámetro aparente 2 max(R, r_tip)
  D_acostado_max_rel_D: null    # con r_tip ≤ 1.2 R y 4 aletas a 45° el D acostado ya es D (redundante)
  L_c_min_rel_cola: null        # convención "cuerpo central ≥ transición + tubo" (v1); la spec v2 la quita
  h_min_mm: 5.0
  c_min_mm: 5.0
  eps_CN: 0.5                   # guarda: Σ C_Nα < eps_CN → candidato descartado
  angulo_cola_max_deg: null
  cola_base_roma:               # arrastre de la transición como en OpenRocket (Hoerner)
    angulo_inicio_deg: 9.46     # L_t/ΔD = 3
    angulo_base_roma_deg: 26.57 # L_t/ΔD = 1
    infactible: true

objetivo:
  orden: [masa, diametro, SM, taper]  # spec v2 rev. 2; el de dbf-sensor es [masa, diametro, taper, SM]
  pesos: [1.0e6, 1.0e4, 1.0e2, 1.0]   # en el orden de `orden`
  diametro: aparente            # criterio de diámetro: aparente 2 max(R, r_tip) | acostado max(D, √2 r_tip)
  f_SM_modo: max                # max: se prefiere el SM más alto | centro: lo más cerca de SM_centro_cal
  SM_centro_cal: 1.5            # solo con f_SM_modo: centro

ejecucion:
  max_evaluaciones: 2000000
  procesos: auto
  refinamiento: {activar: true, top_K: 10}   # medio paso en las variables de los grupos A, B y C
  validacion_or: {N_ganadores: 5, tol_cp_mm: 2.0, tol_masa_pct: 0.5}
  semilla: 12345                # el barrido es determinista; se conserva por si se agrega muestreo

numerico:
  dx_mm: 0.1
  n_barrido_ell: 600
  tol_raiz_mm: 0.01
  n_franjas_aleta: 48
  n_rotacion_caja: 720          # muestras del giro (en un periodo 360°/n) para la altura aparente
  tol_masa_max_g: 0.5           # (OpenRocket 24.12 acepta un BodyTube de largo 0: el cuerpo abombado no
                                # necesita un largo mínimo)

openrocket:
  ork_base: modelos/analisis_tipo2.ork
  jar: null                     # null → ORLAB_JAR o caché de `python -m orlab fetch 24.12`

salida:
  dir: data_opt
  dir_figuras: figs_opt
  dir_planos: planos
  N_planos: 5                   # planos de los N mejores factibles (no se exporta ningún .ork)
